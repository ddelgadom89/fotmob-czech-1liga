name: FotMob defensa 1. liga checa

on:
  schedule:
    - cron: "0 8 * * 2"   # martes 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install curl_cffi pandas

      - name: Scraping defensa
        run: python fotmob_defence.py

      - name: Commit de los CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/fotmob_defence_*.csv
          git diff --staged --quiet && exit 0
          git commit -m "FotMob defensa $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
